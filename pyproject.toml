[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "yogalayout"
version = "0.2.0"
description = "RAII Python bindings for the Yoga flexbox layout engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.10"
classifiers = ["Typing :: Typed"]

[dependency-groups]
dev = ["pytest>=8", "pyright", "ruff", "hypothesis", "pytest-run-parallel"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/yogalayout"]
wheel.py-api = "cp312"
wheel.exclude = ["**/*.cpp"]
sdist.include = ["extern/yoga/yoga", "extern/yoga/cmake", "extern/yoga/LICENSE"]
sdist.exclude = ["extern/yoga/tests", "extern/yoga/java", "extern/yoga/javascript", "extern/yoga/website", "extern/yoga/csharp", "extern/yoga/benchmark", "extern/yoga/fuzz"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["extern", "tests/conformance"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.cibuildwheel]
# abi3 wheel from cp312 covers 3.12+ (GIL builds); 3.10/3.11 get their own; free-threaded 3.14t
# cannot use abi3, so it is built separately. No 32-bit builds.
build = ["cp310-*", "cp311-*", "cp312-*", "cp314t-*"]
skip = ["*-win32", "*_i686"]
test-requires = ["pytest", "hypothesis"]
test-command = "pytest {project}/tests -q"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
